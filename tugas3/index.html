<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA | Informasi Bahan Ajar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="brand-box">
                    <div class="logo-icon flex items-center justify-center">
                        <img src="assets/img/Logo_Universitas_Terbuka.svg" alt="Logo" class="logo-img">
                    </div>
                    <div class="brand-text">
                        <span class="brand-title">SITTA</span>
                        <span class="brand-subtitle">Informasi Bahan Ajar</span>
                    </div>
                </div>
                <button id="sidebarToggleButton" @click="sidebarToggle" class="toggle-btn" aria-label="Toggle Navigation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevrons-left"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M11 7l-5 5l5 5" /><path d="M17 7l-5 5l5 5" /></svg>
                </button>
            </div>

            <!-- Sidebar Navigation -->
            <nav class="sidebar-nav">
                <button
                    type="button"
                    class="nav-item"
                    v-for="item in navItems"
                    :key="item.id"
                    :class="{ active: tab === item.id }"
                    @click="tab = item.id">
                    <div class="nav-icon" v-html="item.icon"></div>
                    <span class="nav-label" v-text="item.name"></span>
                </button>
            </nav>

            <!-- Sidebar Footer Profile -->
            <div class="sidebar-footer">
                <div class="avatar" id="userAvatar">M</div>
                <div class="user-info">
                    <span class="user-name" id="userName">M. Iqbal Effendi</span>
                    <span class="user-email" id="userEmail">054940372</span>
                </div>
                <button @click="logout" class="toggle-btn" aria-label="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-door-exit"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M13 12v.01" /><path d="M3 21h18" /><path d="M5 21v-16a2 2 0 0 1 2 -2h7.5m2.5 10.5v7.5" /><path d="M14 7h7m-3 -3l3 3l-3 3" /></svg>
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <main class="main-content">
                <div v-if="isLoading" class="card text-center text-muted">
                    Memuat data bahan ajar...
                </div>

                <template v-else>
                    <section v-show="tab === 'dasbor'">
                        <dashboard-view
                            :stok="state.stok"
                            :tracking="state.tracking"
                            @navigate="tab = $event"
                            @quick-search="searchDeliveryOrder">
                        </dashboard-view>
                    </section>

                    <section v-show="tab === 'stok'">
                        <ba-stock-table
                            :items="state.stok"
                            :upbjj-list="state.upbjjList"
                            :kategori-list="state.kategoriList"
                            @create-stock="handleCreateStock"
                            @update-stock="handleUpdateStock"
                            @delete-stock="handleDeleteStock">
                        </ba-stock-table>
                    </section>

                    <section v-show="tab === 'tracking'">
                        <do-tracking
                            ref="trackingComponent"
                            :data="state.tracking"
                            :paket-list="state.paket"
                            @add-progress="handleAddProgress"
                            @open-order="isOrderModalOpen = true">
                        </do-tracking>
                    </section>
                </template>
            </main>
        </div>

        <order-form
            :is-open="isOrderModalOpen"
            :paket="state.paket"
            :ekspedisi="state.pengirimanList"
            :stok="state.stok"
            :tracking="state.tracking"
            @created="handleNewDO"
            @close="isOrderModalOpen = false">
        </order-form>

        <app-modal ref="modal"></app-modal>
    </div>

    <!-- Scripts -->
    <script src="js/services/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components/dashboard-view.js"></script>
    <script src="js/components/status-badge.js"></script>
    <script src="js/components/app-modal.js"></script>
    <script src="js/components/stock-table.js"></script>
    <script src="js/components/do-tracking.js"></script>
    <script src="js/components/order-form.js"></script>
    <script>
        async function bootstrapApp() {
            const templatePaths = [
                'templates/dashboard-view.html',
                'templates/stock-table.html',
                'templates/status-badge.html',
                'templates/do-tracking.html',
                'templates/order-form.html',
                'templates/app-modal.html'
            ];

            const templates = await Promise.all(
                templatePaths.map(path => fetch(`${path}?v=4`, { cache: 'no-store' }).then(res => res.text()))
            );

            dashboardTemplates.forEach((template, index) => {
                console.log(`[DEBUG] tpl-dashboard ${index}:`, template.innerHTML);
                console.log(
                    `[DEBUG] Contains filters.search:`,
                    template.innerHTML.includes('filters.search')
                );
            });
            app.mount('#app');
        }

        bootstrapApp();
    </script>
</body>
</html>
