<template id="tpl-modal">
    <div class="modal-overlay" :class="{ active: isOpen }" @click.self="handleCancel">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">{{ title }}</h3>
                <button type="button" @click="handleCancel" class="modal-close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p v-html="message"></p>
            </div>
            <div class="modal-footer">
                <button v-if="mode === 'confirm'" type="button" @click="handleCancel" class="btn btn-outline">
                    {{ cancelText }}
                </button>
                <button
                    type="button"
                    @click="handleConfirm"
                    class="btn"
                    :class="type === 'danger' ? 'btn-danger' : 'btn-primary'">
                    {{ confirmText }}
                </button>
            </div>
        </div>
    </div>
</template>
